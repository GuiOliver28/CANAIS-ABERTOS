name: Android Build - Canais Abertos

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
  uses: android-actions/setup-android@v4
  with:
    packages: 'platform-tools'
    
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Localizar e extrair zip do projeto
        id: extract
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::Nenhum .zip encontrado na raiz do repositório"
            exit 1
          fi
          echo "Zip encontrado: $ZIP"
          mkdir -p _work
          unzip -q "$ZIP" -d _work

          # Detecta a raiz do projeto (zip pode ter pasta interna)
          if [ -f "_work/settings.gradle.kts" ] || [ -f "_work/settings.gradle" ]; then
            ROOT="_work"
          else
            CANDIDATE=$(find _work -maxdepth 2 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n1)
            if [ -z "$CANDIDATE" ]; then
              echo "::error::settings.gradle(.kts) não encontrado dentro do zip"
              find _work -maxdepth 3 -type d
              exit 1
            fi
            ROOT=$(dirname "$CANDIDATE")
          fi
          echo "Raiz do projeto: $ROOT"
          echo "root=$ROOT" >> $GITHUB_OUTPUT

      - name: Verificar estrutura do projeto
        run: |
          cd "${{ steps.extract.outputs.root }}"
          echo "--- Conteúdo da raiz ---"
          ls -la
          echo "--- settings.gradle(.kts) ---"
          cat settings.gradle.kts 2>/dev/null || cat settings.gradle 2>/dev/null || true
          echo "--- Módulos declarados ---"
          grep -E "include" settings.gradle.kts 2>/dev/null || grep -E "include" settings.gradle 2>/dev/null || true

      - name: Dar permissão ao gradlew
        run: |
          cd "${{ steps.extract.outputs.root }}"
          if [ ! -f gradlew ]; then
            echo "::error::gradlew ausente no zip"
            exit 1
          fi
          chmod +x gradlew

      - name: Rodar testes unitários do core-data
        id: tests
        continue-on-error: true
        run: |
          cd "${{ steps.extract.outputs.root }}"
          set +e
          ./gradlew :core-data:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build-tests.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Gerar APK de debug
        id: build
        continue-on-error: true
        run: |
          cd "${{ steps.extract.outputs.root }}"
          set +e
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-apk.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload do relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: |
            ${{ steps.extract.outputs.root }}/core-data/build/reports/tests/testDebugUnitTest/
            ${{ steps.extract.outputs.root }}/build-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload do log de build (sempre, mesmo falhando)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ steps.extract.outputs.root }}/build-tests.log
            ${{ steps.extract.outputs.root }}/build-apk.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload do APK de debug
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: canais-abertos-debug
          path: ${{ steps.extract.outputs.root }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Falhar explicitamente se o build falhou
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::O build falhou. Baixe o artifact 'build-logs' e verifique build-apk.log"
          exit 1
